[package]
name = "spacecrab-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Library for scanning directories and measuring file sizes, used by the spacecrab disk usage analyzer"
keywords = ["disk-usage", "filesystem", "directory", "size", "scanner"]
categories = ["filesystem"]

[dev-dependencies]
tempfile = "3.19.1"

# It's a library others build on, so every public item needs docs and Debug.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
