name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Releases run one at a time, in order. A published release is never cancelled:
# later ones wait in the queue (up to 100) until the running one finishes.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-core:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: rustup update stable && rustup default stable

      - name: Check tag matches Cargo version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "spacecrab").version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match Cargo version $version"
            exit 1
          fi

      - name: Cargo test
        run: cargo test --workspace --locked

      - name: Publish spacecrab-core
        run: cargo publish -p spacecrab-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  publish-cli:
    needs: publish-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: rustup update stable && rustup default stable

      - name: Publish spacecrab
        run: cargo publish -p spacecrab --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  # Prebuilt binaries, attached to the GitHub release once both crates are published.
  # Archive names (spacecrab-<target>-vX.Y.Z) match cargo-binstall's default lookup.
  upload-binaries:
    needs: publish-cli
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and upload spacecrab
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: spacecrab
          target: ${{ matrix.target }}
          archive: $bin-$target-$tag
          include: README.md,LICENSE-MIT.MD,LICENSE-APACHE.MD
          checksum: sha256
          build-tool: cargo
          locked: true
