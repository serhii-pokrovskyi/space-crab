name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to the PR cancels its outdated run.
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Quick checks that don't depend on the OS, so one Linux runner is enough.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's preinstalled Rust can be a bit behind, so grab the latest stable.
      - name: Set up Rust
        run: rustup update stable && rustup default stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PRs reuse main's cache but don't save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      # Any rustdoc warning, like a broken doc link, fails the job.
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # Packs and builds both crates the way `cargo publish` does, without uploading.
      - name: Package
        run: cargo package --workspace --locked

  # Clippy and tests on Linux, macOS and Windows.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Let every OS finish, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
    # Bash on Windows too, so the same commands work everywhere.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PRs reuse main's cache but don't save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

  # Makes sure we still build on the oldest Rust we say we support.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up minimum supported Rust (rust-version from Cargo.toml)
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "spacecrab").rust_version')
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"

      - name: Test
        run: cargo test --workspace --locked

  # One pass/fail check for the whole run. `always()` keeps it running when a job
  # above fails; otherwise it would be skipped, and skipped counts as passing.
  ci-ok:
    if: always()
    needs: [lint, test, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
